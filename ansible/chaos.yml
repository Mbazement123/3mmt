- name: Orchestrate Disaster Recovery Chaos Simulation
  hosts: target_vm
  become: yes
  vars:
    fail_stage: "{{ fail_stage | default('failover') }}"
  tasks:
    # -------------------------------------------------------------
    # 1. FAILOVER STAGE (Take one frontend replica out of service)
    # -------------------------------------------------------------
    - name: Scale frontend deployment down to 1 replica to simulate one instance failing
      become_user: ubuntu
      ansible.builtin.command: kubectl scale deployment/biodata-frontend --replicas=1 -n default
      when: fail_stage == 'failover'

    - name: Wait for the remaining replica to become ready
      become_user: ubuntu
      ansible.builtin.command: kubectl rollout status deployment/biodata-frontend -n default --timeout=120s
      when: fail_stage == 'failover'
      changed_when: false

    - name: Pause to let traffic shift to the remaining ready pod
      ansible.builtin.pause:
        seconds: 30
      when: fail_stage == 'failover'

    # -------------------------------------------------------------
    # 2. FAILBACK STAGE (Restore capacity to 2 replicas)
    # -------------------------------------------------------------
    - name: Restore frontend deployment back to 2 replicas
      become_user: ubuntu
      ansible.builtin.command: kubectl scale deployment/biodata-frontend --replicas=2 -n default
      when: fail_stage == 'failback'

    - name: Wait until the frontend deployment is fully back up
      become_user: ubuntu
      ansible.builtin.command: kubectl rollout status deployment/biodata-frontend -n default --timeout=120s
      when: fail_stage == 'failback'
      changed_when: false

    # -------------------------------------------------------------
    # 3. VERIFICATION & HEALTH CHECK
    # -------------------------------------------------------------
    - name: Inspect frontend pod status after the simulated failure
      become_user: ubuntu
      ansible.builtin.command: kubectl get pods -n default -l app=biodata-frontend -o wide
      register: health_log

    - name: Show frontend service endpoints
      become_user: ubuntu
      ansible.builtin.command: kubectl get endpoints biodata-frontend -n default
      register: endpoint_log

    - name: Print status summary
      ansible.builtin.debug:
        msg:
          - "Frontend pods: {{ health_log.stdout_lines | default([]) }}"
          - "Frontend endpoints: {{ endpoint_log.stdout_lines | default([]) }}"