---
# Tasks for preparing the host: packages, docker, pip modules, swap
- name: Disable background unattended upgrades to prevent sshd restarts
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Force purge all stale or corrupt legacy apt source configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker-ce.list
    - /etc/apt/sources.list.d/archive_uri-https_docker_com-jammy.list

- name: Clean stale apt locks and ensure remote tmp directory
  ansible.builtin.shell: |
    rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
    mkdir -p /tmp/.ansible-remote
    chmod 777 /tmp/.ansible-remote
  changed_when: false

- name: Create apt keyrings directory structure
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official cryptographic GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker-archive-keyring.asc
    mode: '0644'

- name: Convert Docker GPG key into an apt keyring
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /tmp/docker-archive-keyring.asc
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker official production repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

- name: Update apt index and install essentials (Official Docker CE)
  ansible.builtin.apt:
    update_cache: yes
    name: [curl, git, apt-transport-https, ca-certificates, python3-pip, nfs-common, docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, prometheus-node-exporter]
    state: present

- name: Create 2GB swap file to prevent OOM SSH drops
  ansible.builtin.shell: |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  changed_when: false

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes

- name: Reset SSH connection to refresh docker group permissions
  ansible.builtin.meta: reset_connection
