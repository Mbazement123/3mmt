---
---
- name: Add prometheus-community Helm repository
  become_user: ubuntu
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://prometheus-community.github.io/helm-charts"

- name: Ensure monitoring namespace exists
  become_user: ubuntu
  kubernetes.core.k8s:
    name: monitoring
    kind: Namespace
    state: present

- name: Deploy kube-prometheus-stack via Helm
  become_user: ubuntu
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    values:
      grafana:
        service:
          type: NodePort
          nodePort: 31000

- name: Render Grafana alerting manifest to host
  ansible.builtin.template:
    src: /home/mbazement/project/3mmt/ansible/grafana-alerting.yml
    dest: /home/ubuntu/grafana-alerting.yml
    owner: ubuntu
    group: ubuntu

- name: Apply Grafana alerting manifests
  become_user: ubuntu
  kubernetes.core.k8s:
    state: present
    src: /home/ubuntu/grafana-alerting.yml
