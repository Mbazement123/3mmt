---
# Application deployment tasks (tagged as 'app')
- name: Ensure application directory exists
  ansible.builtin.file:
    path: /home/ubuntu/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  tags: ['app']

- name: Copy docker-compose.yml to host
  ansible.builtin.copy:
    src: ../docker-compose.yml
    dest: /home/ubuntu/app/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  tags: ['app']

- name: Copy backend source to host
  ansible.builtin.copy:
    src: ../backend/
    dest: /home/ubuntu/app/backend/
    owner: ubuntu
    group: ubuntu
    mode: '0755'
    remote_src: false
  tags: ['app']

- name: Copy frontend source to host
  ansible.builtin.copy:
    src: ../frontend/
    dest: /home/ubuntu/app/frontend/
    owner: ubuntu
    group: ubuntu
    mode: '0755'
    remote_src: false
  tags: ['app']

- name: Build Docker images and load directly into Minikube
  become_user: ubuntu
  ansible.builtin.shell: |
    eval $(minikube docker-env)
    docker compose -f /home/ubuntu/app/docker-compose.yml build
  args:
    executable: /bin/bash
  tags: ['app']

- name: Copy application Kubernetes manifests to host
  ansible.builtin.copy:
    src: ../ansible/app-deployment.yml
    dest: /home/ubuntu/app-deployment.yml
    owner: ubuntu
    group: ubuntu
  tags: ['app']

- name: Apply application manifests into cluster
  become_user: ubuntu
  kubernetes.core.k8s:
    state: present
    namespace: default
    src: /home/ubuntu/app-deployment.yml
  tags: ['app']

- name: Rolling restart frontend and backend deployments
  become_user: ubuntu
  ansible.builtin.shell: |
    kubectl rollout restart deployment/biodata-frontend -n default || true
    kubectl rollout restart deployment/biodata-backend -n default || true
  args:
    executable: /bin/bash
  tags: ['app']

- name: Wait for frontend deployment to become ready
  become_user: ubuntu
  ansible.builtin.command: kubectl rollout status deployment/biodata-frontend -n default --timeout=300s
  register: frontend_rollout
  changed_when: false
  ignore_errors: true
  tags: ['app']

- name: Debug failing pods if rollout timed out
  become_user: ubuntu
  ansible.builtin.shell: |
    echo "=== POD STATUS ==="
    kubectl get pods -n default -l app=biodata-frontend
    echo "=== DESCRIBE PODS ==="
    kubectl describe pods -n default -l app=biodata-frontend
    echo "=== POD LOGS ==="
    kubectl logs -n default -l app=biodata-frontend --tail=50 || true
  args:
    executable: /bin/bash
  when: frontend_rollout.rc != 0
  tags: ['app']

- name: Fail build if frontend rollout failed
  ansible.builtin.fail:
    msg: "Frontend rollout timed out or failed to reach ready state. Check the debug output above for details."
  when: frontend_rollout.rc != 0
  tags: ['app']

- name: Start frontend port-forward after the app is up
  become_user: ubuntu
  ansible.builtin.shell: |
    if ! pgrep -f "kubectl port-forward svc/biodata-frontend 3000:3000 --address 0.0.0.0" >/dev/null 2>&1; then
      nohup kubectl port-forward svc/biodata-frontend 3000:3000 --address 0.0.0.0 >/home/ubuntu/port-forward-frontend.log 2>&1 &
    fi
  args:
    executable: /bin/bash
  tags: ['app']