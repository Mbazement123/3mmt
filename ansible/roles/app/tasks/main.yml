---
# Application deployment tasks (tagged as 'app')
- name: Ensure application directory exists
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  tags: ['app']

- name: Copy docker-compose.yml to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: /opt/app/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  tags: ['app']

- name: Copy backend source to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/"
    dest: /opt/app/backend/
    owner: ubuntu
    group: ubuntu
    mode: '0755'
    remote_src: false
  tags: ['app']

- name: Copy frontend source to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../frontend/"
    dest: /opt/app/frontend/
    owner: ubuntu
    group: ubuntu
    mode: '0755'
    remote_src: false
  tags: ['app']

- name: Build and start the Docker Compose application
  become_user: ubuntu
  ansible.builtin.shell: |
    docker compose -f /opt/app/docker-compose.yml build
    docker compose -f /opt/app/docker-compose.yml up -d
  tags: ['app']
