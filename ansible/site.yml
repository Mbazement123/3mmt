---
- name: Connection Pre-Flight Check
  hosts: target_vm
  gather_facts: no
  tasks:
    - name: Patiently wait for instance SSH to finish initializing
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
    - name: Wait for cloud-init system setup to complete
      block:
        - name: Wait for cloud-init system setup to complete
          ansible.builtin.command: cloud-init status --wait
          changed_when: false
      rescue:
        - name: Collect cloud-init status details
          ansible.builtin.command: cloud-init status --long
          register: cloud_init_status
          changed_when: false
          failed_when: false

        - name: Collect cloud-init logs
          ansible.builtin.command: journalctl -u cloud-init -u cloud-final --no-pager -n 100
          register: cloud_init_logs
          changed_when: false
          failed_when: false

        - name: Fail with cloud-init diagnostics
          ansible.builtin.fail:
            msg: |
              cloud-init failed during instance setup.

              Status:
              {{ cloud_init_status.stdout | default('unavailable') }}

              Logs:
              {{ cloud_init_logs.stdout | default('unavailable') }}

- name: Configuration readiness check
  hosts: target_vm
  become: yes
  gather_facts: yes
  tasks:
    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Check whether Docker Compose is already installed
      ansible.builtin.command: docker compose version
      register: compose_check
      changed_when: false
      failed_when: false

    - name: Check whether app source has already been copied to the VM
      ansible.builtin.stat:
        path: /opt/app/docker-compose.yml
      register: app_dir_check

    - name: Set provisioning decision
      ansible.builtin.set_fact:
        needs_provisioning: "{{ force_deploy | default(false) | bool or docker_check.rc != 0 or compose_check.rc != 0 or not app_dir_check.stat.exists }}"

- name: Core Configuration Phase (roles)
  hosts: target_vm
  become: yes
  gather_facts: yes
  pre_tasks:
    - name: Skip configuration if infrastructure and app configuration already exist
      ansible.builtin.debug:
        msg: "Existing infrastructure and configuration detected; provisioning steps skipped and marked complete."
      when: not needs_provisioning
  roles:
    - role: common
      when: needs_provisioning
    - role: app
      when: needs_provisioning
  tasks:
    - name: Mark deployment as complete when configuration already exists
      ansible.builtin.debug:
        msg: "Deployment already complete; no provisioning was required."
      when: not needs_provisioning
