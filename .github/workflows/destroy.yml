name: Terraform Cloud + AWS Destroy

on:
  workflow_dispatch:
    

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-north-1
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    name: Plan and destroy Terraform infrastructure
    runs-on: ubuntu-latest
    environment: terraform-destroy
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Create destroy plan
        working-directory: terraform
        run: terraform plan -refresh=true -destroy -out=tfplan

      - name: Apply destroy plan
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Verify regional AWS resources were removed
        env:
          PRIMARY_REGION: eu-north-1
          DR_REGION: us-west-2
        run: |
          set -euo pipefail

          for region in "$PRIMARY_REGION" "$DR_REGION"; do
            test "$(aws elbv2 describe-load-balancers \
              --region "$region" \
              --query "length(LoadBalancers[?contains(LoadBalancerName, 'biodata-')])" \
              --output text)" = "0"

            test "$(aws ec2 describe-security-groups \
              --region "$region" \
              --filters Name=tag:Project,Values=biodata \
              --query 'length(SecurityGroups)' \
              --output text)" = "0"

            test "$(aws efs describe-file-systems \
              --region "$region" \
              --query "length(FileSystems[?CreationToken == 'biodata-primary-efs' || CreationToken == 'biodata-dr-efs'])" \
              --output text)" = "0"
          done

      - name: Report completion
        if: success()
        run: |
          echo "Terraform Cloud workspace infrastructure has been destroyed. Reason: ${{ inputs.reason || 'not provided' }}"
