name: Terraform Cloud + AWS Destroy

on:
  workflow_dispatch:
    

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-north-1
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    name: Plan and destroy Terraform infrastructure
    runs-on: ubuntu-latest
    environment: terraform-destroy
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Remove unmanaged AWS leftovers
        env:
          PRIMARY_REGION: eu-north-1
          LEGACY_PRIMARY_REGION: us-east-1
          DR_REGION: us-west-2
        run: |
          set -euo pipefail

          cleanup_region() {
            local region="$1"

            for asg in biodata-primary-asg biodata-dr-asg; do
              for instance_id in $(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$asg" \
                --region "$region" \
                --query 'AutoScalingGroups[0].Instances[].InstanceId' \
                --output text); do
                aws ec2 terminate-instances \
                  --instance-ids "$instance_id" \
                  --region "$region" 2>/dev/null || true
              done

              aws autoscaling delete-auto-scaling-group \
                --auto-scaling-group-name "$asg" \
                --force-delete \
                --region "$region" 2>/dev/null || true
            done

            for lb_arn in $(aws elbv2 describe-load-balancers \
              --region "$region" \
              --query "LoadBalancers[?contains(LoadBalancerName, 'biodata-primary-alb') || contains(LoadBalancerName, 'biodata-dr-alb')].LoadBalancerArn" \
              --output text); do
              for listener_arn in $(aws elbv2 describe-listeners \
                --load-balancer-arn "$lb_arn" \
                --region "$region" \
                --query 'Listeners[].ListenerArn' \
                --output text); do
                aws elbv2 delete-listener --listener-arn "$listener_arn" --region "$region" || true
              done
              aws elbv2 delete-load-balancer --load-balancer-arn "$lb_arn" --region "$region" || true
              aws elbv2 wait load-balancers-deleted --load-balancer-arns "$lb_arn" --region "$region" || true
            done

            for tg_arn in $(aws elbv2 describe-target-groups \
              --region "$region" \
              --query "TargetGroups[?contains(TargetGroupName, 'biodata-primary-tg') || contains(TargetGroupName, 'biodata-dr-tg')].TargetGroupArn" \
              --output text); do
              aws elbv2 delete-target-group --target-group-arn "$tg_arn" --region "$region" || true
            done

            for file_system_id in $(aws efs describe-file-systems \
              --region "$region" \
              --query "FileSystems[?CreationToken == 'biodata-primary-efs' || CreationToken == 'biodata-dr-efs'].FileSystemId" \
              --output text); do
              for mount_target_id in $(aws efs describe-mount-targets \
                --file-system-id "$file_system_id" \
                --region "$region" \
                --query 'MountTargets[].MountTargetId' \
                --output text); do
                aws efs delete-mount-target --mount-target-id "$mount_target_id" --region "$region" || true
                aws efs wait mount-target-deleted --mount-target-id "$mount_target_id" --region "$region" || true
              done
              aws efs delete-file-system --file-system-id "$file_system_id" --region "$region" || true
            done

            aws ec2 delete-key-pair \
              --key-name biodata-project-key \
              --region "$region" 2>/dev/null || true
          }

          cleanup_region "$PRIMARY_REGION"
          cleanup_region "$LEGACY_PRIMARY_REGION"
          cleanup_region "$DR_REGION"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Create destroy plan
        working-directory: terraform
        run: terraform plan -destroy -out=tfplan

      - name: Apply destroy plan
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Report completion
        if: success()
        run: |
          echo "Terraform Cloud workspace infrastructure has been destroyed. Reason: ${{ inputs.reason || 'not provided' }}"
